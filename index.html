<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#161313">
<meta name="description" content="aznur / restaurant studio — a single-file, privacy-first restaurant analytics workspace: sales, menu engineering, COGS reconciliation, inventory, labor, forecasting, daily operations and margin control. All analysis runs locally.">
<title>aznur / restaurant studio</title>
<style>
/* ============ design tokens (aznur lab family) ============ */
:root{
--font:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--radius:4px;--radius-sm:3px;--radius-lg:6px;color-scheme:dark;
--bg:#161313;--panel:#1c1818;--panel2:#211d1d;--panel3:#211d1d;
--line:#302c2c;--line2:#454040;--text:#f1eeee;--muted:#a3a0a0;--subtle:#7a7676;
--accent:#f59e0b;--accent-hover:#d97706;--good:#10b981;--warn:#f59e0b;--bad:#f87171;--info:#60a5fa;
--lab-bg:#141110;--lab-deep:#0f0d0b;--lab-border:#2a2620;--lab-text:#f5f5f4;--lab-muted:#a8a29e;--lab-amber:#fbbf24;
--sidebar:250px;
}
:root[data-theme=light]{
color-scheme:light;
--bg:#fdfcfc;--panel:#faf8f7;--panel2:#f4f0ef;--panel3:#f4f0ef;
--line:#dcd9d9;--line2:#c9c4c4;--text:#201d1d;--muted:#5c5858;--subtle:#78716c;
--accent:#b45309;--accent-hover:#92400e;--good:#047857;--warn:#b45309;--bad:#b91c1c;--info:#2563eb;
--lab-amber:#f59e0b;
}
/* ============ base ============ */
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;font-family:var(--font)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover);text-decoration:underline}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em;margin:0}
.muted{color:var(--muted)}.smalltext{font-size:10.5px}
::selection{background:rgba(245,158,11,.28)}
/* ============ scrollbars ============ */
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.tablewrap::-webkit-scrollbar-thumb,.chartbox::-webkit-scrollbar-thumb{background:var(--lab-border);border-color:var(--lab-bg)}
/* ============ app shell ============ */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:56px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line);grid-column:1/-1}
.brand{display:flex;align-items:baseline;gap:6px;color:var(--text);min-width:0;font-size:12.5px}
.brand:hover{text-decoration:none}
.brand strong{font-weight:700;background:linear-gradient(90deg,var(--accent),#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-slash{color:var(--subtle)}.brand-title{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-meta{flex:1;min-width:0;color:var(--subtle);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-meta b{color:var(--muted);font-weight:500}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.top-actions label{font-size:10px;color:var(--subtle);text-transform:uppercase;letter-spacing:.1em}
#menuBtn{display:none}
/* ============ controls ============ */
select,.btn{border:1px solid var(--line2);background:var(--panel3);color:var(--text);border-radius:var(--radius);padding:6px 10px;font-size:11.5px;line-height:1.3}
.btn{font-weight:500;white-space:nowrap;transition:border-color .12s,color .12s,background .12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#161313;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#161313}
:root[data-theme=light] .btn.primary,:root[data-theme=light] .btn.primary:hover{color:#fdfcfc}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 45%,var(--line2));color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btn.small{padding:5px 8px;font-size:10.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* ============ sidebar ============ */
.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.side-title{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;color:var(--subtle);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.pill,.tag{border:1px solid var(--line2);border-radius:var(--radius-sm);padding:2px 6px;font-size:9.5px;color:var(--muted);white-space:nowrap;font-weight:500}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line2))}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line2))}
.search{display:flex;gap:6px;align-items:center;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel3);margin-bottom:12px;color:var(--subtle);font-size:11px}
.search:focus-within{border-color:var(--accent)}
.search input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:11.5px;padding:0}
.search input::placeholder{color:var(--subtle)}
.search kbd{border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 5px;font-size:9.5px;color:var(--subtle);background:var(--bg)}
.section-label{margin:12px 6px 6px;color:var(--subtle);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;min-height:30px;border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--muted);text-align:left;font-size:11.5px;transition:background .1s,color .1s,border-color .1s}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:var(--panel2);border-color:var(--line2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent);font-weight:500}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.save-row{display:flex;justify-content:space-between;color:var(--subtle);font-size:10px;letter-spacing:.06em;margin-bottom:8px;text-transform:uppercase}
.save-row strong{color:var(--good);font-weight:500}
.side-actions{display:flex;gap:6px}
.side-actions .btn{flex:1;padding:5px 6px;font-size:10.5px}
.side-note{margin-top:8px;font-size:9.5px;color:var(--subtle);line-height:1.5}
/* ============ content ============ */
.content{min-width:0;display:flex;flex-direction:column}
.container{width:min(1500px,100%);margin:0 auto;padding:22px 24px 30px;flex:1}
.view{display:none}
.view.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view.active>*{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
.view.active>*:nth-child(2){animation-delay:.03s}.view.active>*:nth-child(3){animation-delay:.06s}.view.active>*:nth-child(n+4){animation-delay:.09s}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.pagehead h3{font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-.015em}
.pagehead .eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--accent);margin-bottom:7px}
.pagehead p{margin:7px 0 0;color:var(--muted);font-size:11.5px;max-width:760px;line-height:1.6}
/* ============ grids & cards ============ */
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.two{grid-template-columns:1.45fr .95fr}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card,.stat{min-width:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.card{padding:14px 15px}
.card h4{margin:0 0 11px;color:var(--accent);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.stat{position:relative;overflow:hidden;padding:11px 13px;background:var(--panel3)}
.stat:before{position:absolute;inset:0 auto 0 0;width:2px;content:"";background:var(--accent);opacity:.8}
.stat .k{color:var(--subtle);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.stat .v{margin:5px 0 2px;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.stat .d{color:var(--subtle);font-size:9.5px}
.action-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.action-tile{padding:11px 13px;border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:var(--radius);background:var(--panel3);min-width:0}
.action-tile .label{color:var(--subtle);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.action-tile strong{display:block;margin-top:5px;font-size:16px;font-weight:600;overflow-wrap:anywhere}
/* ============ forms ============ */
.field label{display:block;margin-bottom:4px;color:var(--subtle);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--panel3);color:var(--text);font-size:11.5px}
.field textarea{min-height:80px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(245,158,11,.12)}
.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.span2{grid-column:span 2}
.check-row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);cursor:pointer}
.check-row input{accent-color:var(--accent)}
.checklist{display:grid;gap:6px}
/* ============ tables ============ */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--lab-bg)}
.table{width:100%;border-collapse:collapse;font-size:10.5px}
.table th,.table td{padding:7px 9px;border-bottom:1px solid var(--lab-border);text-align:left;white-space:nowrap;color:var(--lab-text)}
.table th{position:sticky;top:0;background:#1a1613;color:var(--lab-muted);font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;z-index:1}
.table tbody tr:hover td{background:rgba(245,158,11,.06)}
.table tbody tr:last-child td{border-bottom:0}
.table.compact th,.table.compact td{padding:5px 7px;font-size:9.5px}
.table td.empty{color:var(--lab-muted)}
/* ============ badges, lists, notices ============ */
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:var(--radius-sm);font-size:8.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid transparent}
.badge.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.badge.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.metric-list,.list-clean{display:grid;gap:6px;padding:0;margin:0;list-style:none}
.metric-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.metric-row:last-child{border-bottom:0}
.metric-row strong{font-size:11px;color:var(--text);text-align:right;font-weight:600}
.list-clean li{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel3);font-size:11px;line-height:1.55;color:var(--muted)}
.list-clean li strong{color:var(--text)}
.alert-list{display:grid;gap:6px}
.alert-item{padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--subtle);border-radius:var(--radius);background:var(--panel3);font-size:11px;line-height:1.55;color:var(--muted)}
.alert-item strong{color:var(--text)}
.alert-item.good{border-left-color:var(--good)}
.alert-item.warn{border-left-color:var(--warn)}
.alert-item.bad{border-left-color:var(--bad)}
.alert-item.info{border-left-color:var(--info)}
.notice,.warning,.dangerbox,.successbox{padding:9px 11px;border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius);font-size:11px;line-height:1.6;color:var(--muted);background:var(--panel3)}
.notice{border-left-color:var(--accent)}
.warning{border-left-color:var(--warn)}
.dangerbox{border-left-color:var(--bad)}
.successbox{border-left-color:var(--good)}
.notice strong,.warning strong{color:var(--warn)}
.dangerbox strong{color:var(--bad)}.successbox strong{color:var(--good)}
.footer-note{margin-top:8px;font-size:10px;color:var(--subtle);line-height:1.55}
.progress{height:4px;overflow:hidden;border-radius:2px;background:var(--panel3);border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#fbbf24)}
.score-ring{width:96px;height:96px;margin:4px auto 0;display:grid;place-items:center;border:3px solid var(--accent);border-radius:50%;background:var(--panel3)}
.score-ring strong{font-size:26px;font-weight:600;color:var(--accent)}
.heatmap{display:grid;gap:4px}
.hmh{font-size:8.5px;color:var(--subtle);text-transform:uppercase;letter-spacing:.08em;text-align:center}
/* ============ charts (always dark stage) ============ */
.chartbox{position:relative;background:var(--lab-deep);border:1px solid var(--lab-border);border-radius:var(--radius);padding:10px;overflow:auto}
.plotstage{width:100%}
.plotstage svg{width:100%;height:auto;display:block}
.chartbox.sm .plotstage svg{max-height:230px}
.chartbox.tall .plotstage svg{max-height:360px}
/* ============ import / drop ============ */
.drop{padding:22px 18px;border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line2));border-radius:var(--radius);background:var(--panel3);text-align:center;transition:border-color .12s,background .12s}
.drop.drag{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel3))}
.drop input{display:none}
.drop strong{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.drop span{display:block;margin:6px 0 11px;color:var(--muted);font-size:10.5px;line-height:1.55}
.taggrid{display:flex;gap:5px;flex-wrap:wrap}
.taggrid .tag{cursor:default}
.taggrid .tag.click{cursor:pointer}
.taggrid .tag.click:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:20px 10px;color:var(--subtle);text-align:center;font-size:11px}
.hr{height:1px;margin:12px 0;background:var(--line)}
.import-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.import-stat{padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel3)}
.import-stat span{display:block;color:var(--subtle);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.import-stat strong{display:block;margin-top:4px;font-size:14px;font-weight:600}
.import-map-table select{min-width:200px;padding:4px 6px;font-size:10.5px;background:var(--panel3);color:var(--text);border:1px solid var(--line2);border-radius:var(--radius-sm)}
/* ============ modal & toast ============ */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.6)}
.modal.show{display:flex}
.modalbox{width:min(1000px,100%);max-height:88vh;overflow:auto;padding:18px;border:1px solid var(--line2);border-radius:var(--radius-lg);background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.4)}
.modalbox.narrow{width:min(440px,100%)}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modalhead h3{color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.close{width:28px;height:28px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--panel3);color:var(--muted)}
.close:hover{border-color:var(--accent);color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.kbd-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.kbd-row:last-of-type{border-bottom:0}
.kbd-row kbd{border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--panel3);color:var(--text);padding:1px 7px;font-size:10.5px}
.toast{position:fixed;z-index:99;bottom:18px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:var(--radius);padding:9px 14px;font-size:11.5px;color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,.3);transition:opacity .14s,transform .14s;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .btn{padding:3px 9px;font-size:10.5px}
/* ============ statusbar ============ */
.statusbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:26px;padding:0 24px;border-top:1px solid var(--line);background:var(--bg);color:var(--subtle);font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.statusbar b{color:var(--accent);font-weight:600}
/* ============ trends ============ */
.trend-good{color:var(--good)!important}
.trend-warn{color:var(--warn)!important}
.trend-bad{color:var(--bad)!important}
/* ============ responsive ============ */
@media(max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.action-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1180px){.two,.three,.four{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
.app{grid-template-columns:1fr}
.topbar{height:auto;min-height:56px;flex-wrap:wrap;gap:10px;padding:10px 14px}
.top-meta{display:none}#menuBtn{display:inline-flex}
.sidebar{position:fixed;top:0;left:-270px;z-index:40;width:250px;height:100vh;transition:left .18s;box-shadow:0 0 40px rgba(0,0,0,.4)}
.sidebar.open{left:0}
.container{padding:16px 14px 26px}
.kpis,.two,.three,.four,.action-grid{grid-template-columns:1fr}
.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}
.pagehead{align-items:flex-start;flex-direction:column}
.import-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
.import-map-table select{min-width:130px}
.statusbar{padding:6px 14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media print{
.topbar,.sidebar,.statusbar,.btn,.toolbar,.drop,.modal,.toast{display:none!important}
.app{display:block}.container{padding:0;width:auto}
.view{display:none!important}.view.active{display:block!important}
.card,.stat,.action-tile{box-shadow:none;break-inside:avoid;background:#fff!important;border-color:#ccc!important;color:#111!important}
.card h4,.stat .k,.stat .v,.stat .d,.metric-row,.metric-row strong,.list-clean li,.alert-item,.notice,.warning,.dangerbox,.successbox{color:#111!important}
.tablewrap,.table th,.table td,.chartbox{background:#fff!important;color:#111!important;border-color:#ccc!important}
body{background:#fff;color:#111}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<button class="btn small" id="menuBtn" type="button" aria-label="Toggle navigation">☰</button>
<a class="brand" href="#dashboard" id="homeLink"><strong>aznur</strong><span class="brand-slash">/</span><span class="brand-title">restaurant studio</span></a>
<div class="top-meta"><b id="topTitle">Dashboard</b> · <span id="topMeta">local workspace</span></div>
<div class="top-actions">
<select id="locationFilter" aria-label="Location filter"><option value="ALL">All locations</option></select>
<label for="themeSelect">Theme</label>
<select id="themeSelect" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>

/* ============================================================
Small utilities

const $=id=>document.getElementById(id);
function emptyDb(){return Object.fromEntries(KEYS.map(k=>[k,[]]));}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function num(v){
if(v==null||v==="")return 0;
if(typeof v==="number")return Number.isFinite(v)?v:0;
let s=String(v).trim();
const neg=/^\(.*\)$/.test(s);
s=s.replace(/[^0-9.\-]/g,"");
if(!s)return 0;
const n=Number(s);
if(!Number.isFinite(n))return 0;
return neg?-Math.abs(n):n;
}
function norm(v){return String(v||"").toLowerCase().trim().replace(/[\s\-\/().]+/g,"_").replace(/[^a-z0-9_]/g,"");}
function parseDate(v){
if(v instanceof Date&&!Number.isNaN(v.getTime()))return new Date(v.getFullYear(),v.getMonth(),v.getDate());
if(typeof v==="number"&&v>20000&&v<80000)return excelDate(v);
const s=String(v??"").trim();
if(!s)return null;
if(/^\d{5}(\.\d+)?$/.test(s)){const n=Number(s);if(n>20000&&n<80000)return excelDate(n);}
let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
if(m)return new Date(+m[1],+m[2]-1,+m[3]);
m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
if(m){
let y=+m[3];if(y<100)y+=2000;
const a=+m[1],b=+m[2];
const mdy=app.settings.dateFormat==="MDY";
const month=mdy?a:b,day=mdy?b:a;
if(month>12&&day<=12)return new Date(y,day-1,month);
return new Date(y,month-1,day);
}
const d=new Date(s);
return Number.isNaN(d.getTime())?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function excelDate(serial){const ms=Math.round((serial-25569)*86400000);const d=new Date(ms);return Number.isNaN(d.getTime())?null:new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());}
function dateKey(v){const d=parseDate(v);if(!d)return "";return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function currency(){return {BDT:"৳",USD:"$",EUR:"€",INR:"₹",JPY:"¥",GBP:"£"}[app.settings.currency]||app.settings.currency+" ";}
function money(v){const n=num(v),a=Math.abs(n);const s=a>=1e6?`${(n/1e6).toFixed(1)}M`:a>=1e3?`${(n/1e3).toFixed(1)}K`:Math.round(n).toLocaleString();return currency()+s;}
function percent(v){return `${num(v).toFixed(1)}%`;}
function compact(v){const a=Math.abs(v);if(a>=1e9)return (v/1e9).toFixed(1)+"B";if(a>=1e6)return (v/1e6).toFixed(1)+"M";if(a>=1e3)return (v/1e3).toFixed(1)+"k";return String(Math.round(v*100)/100);}
function cache(key,fn){const loc=$("locationFilter")?.value||"ALL",k=`${app.rev}|${loc}|${key}`;if(app.cache.has(k))return app.cache.get(k);const v=fn();app.cache.set(k,v);return v;}
function invalidate(){app.rev++;app.cache.clear();}
function metric(label,value,foot="",cls=""){return `<div class="stat"><div class="k">${esc(label)}</div><div class="v ${cls}">${value}</div><div class="d">${esc(foot)}</div></div>`;}
function loc(row){return String(row.location||row.location_id||"").trim();}
function filtered(type){return cache(`f:${type}`,()=>{const l=$("locationFilter")?.value||"ALL";return l==="ALL"?app.db[type]:(app.db[type]||[]).filter(r=>loc(r)===l);});}
function totalRows(){return KEYS.reduce((a,k)=>a+app.db[k].length,0);}
function hasAnyData(){return totalRows()>0;}
/* ============================================================
Toast, modal, theme, persistence
============================================================ */
let toastTimer=null,toastUndo=null,lastFocus=null,saveTimer=null;
function toast(msg,opts){
const el=$("toast");el.textContent="";
const span=document.createElement("span");span.textContent=msg;el.appendChild(span);
toastUndo=null;
if(opts&&opts.undo){
const b=document.createElement("button");b.type="button";b.className="btn";b.textContent="Undo";
b.onclick=()=>{const f=toastUndo;hideToast();if(f)f();};
el.appendChild(b);toastUndo=opts.undo;
}
el.classList.add("show");
if(toastTimer)clearTimeout(toastTimer);
toastTimer=setTimeout(hideToast,opts&&opts.undo?6500:2300);
}
function hideToast(){$("toast").classList.remove("show");toastUndo=null;}
function openModal(title,html,actions){
lastFocus=document.activeElement;
$("modalTitle").textContent=title;
$("modalBody").innerHTML=html;
$("modalBox").classList.toggle("narrow",!!actions);
const act=$("modalActions");act.textContent="";
if(actions&&actions.length){
act.hidden=false;
actions.forEach(a=>{
const b=document.createElement("button");b.type="button";b.className="btn"+(a.primary?" primary":"")+(a.danger?" danger":"");b.textContent=a.label;
b.onclick=()=>{closeModal();if(a.fn)a.fn();};
act.appendChild(b);
});
}else act.hidden=true;
$("modal").classList.add("show");$("modal").setAttribute("aria-hidden","false");
const first=(actions&&actions.length?act:$("modalBox")).querySelector("button,input,select,textarea");
if(first)first.focus();
}
function closeModal(){$("modal").classList.remove("show");$("modal").setAttribute("aria-hidden","true");if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}
function confirmAction(msg,fn,label="Confirm"){openModal("Please confirm",`<p class="smalltext" style="color:var(--muted);line-height:1.6">${esc(msg)}</p>`,[{label:"Cancel"},{label,primary:true,fn}]);}
function showShortcuts(){
const rows=[["/","Focus view search"],["t","Cycle theme"],["n / p","Next / previous view"],["r","Recalculate current view"],["i","Open the Data Hub"],["?","This panel"],["Esc","Close dialogs"]];
openModal("Keyboard shortcuts",rows.map(r=>`<div class="kbd-row"><span>${esc(r[1])}</span><kbd>${esc(r[0])}</kbd></div>`).join(""),[{label:"Close",primary:true}]);
}
function applyTheme(){
let t=app.settings.theme;
if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
document.documentElement.dataset.theme=t;
$("themeSelect").value=app.settings.theme;
const tc=document.querySelector("meta[name=theme-color]");
if(tc)tc.content=t==="light"?"#fdfcfc":"#161313";
}
function saveNow(){
try{
localStorage.setItem("aznurRestaurantDB",JSON.stringify(app.db));

const el=$("saveStatus");if(el)el.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}catch(e){toast("Local storage is full — export a backup.");}
}
function saveState(){if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250);}
function loadState(){
try{
const db=JSON.parse(localStorage.getItem("aznurRestaurantDB")||"null");
if(db)KEYS.forEach(k=>app.db[k]=Array.isArray(db[k])?db[k]:[]);
const s=JSON.parse(localStorage.getItem("aznurRestaurantSettings")||"null");
if(s)app.settings={...DEFAULTS,...s,staffing:{...DEFAULTS.staffing,...(s.staffing||{})},importProfiles:Array.isArray(s.importProfiles)?s.importProfiles:[],dailyCloses:s.dailyCloses||{}};
}catch(e){}
}
function projectPayload(){return{schemaVersion:3,app:"aznur-restaurant-studio",db:app.db,settings:app.settings,savedAt:new Date().toISOString()};}
function adoptProject(d){
if(!d||typeof d!=="object")throw Error("Not a project object.");
const db=d.db||(d.sales?d:null);
if(!db||typeof db!=="object")throw Error("No datasets found.");
const next=emptyDb();
KEYS.forEach(k=>{if(Array.isArray(db[k]))next[k]=db[k].slice(0,LIMITS.rowsPerSheet);});
app.db=next;
const s=d.settings||{};
app.settings={...DEFAULTS,...s,staffing:{...DEFAULTS.staffing,...(s.staffing||{})},importProfiles:Array.isArray(s.importProfiles)?s.importProfiles:[],dailyCloses:s.dailyCloses||{}};
if(!["system","light","dark"].includes(app.settings.theme))app.settings.theme="system";
if(!["DMY","MDY"].includes(app.settings.dateFormat))app.settings.dateFormat="DMY";
}
function snapshotString(){return JSON.stringify({db:app.db,settings:app.settings});}
function withUndo(msg,mutate){
const snap=snapshotString();
mutate();
invalidate();refreshLocations();saveNow();render();
toast(msg,{undo:()=>{try{adoptProject(JSON.parse(snap));applyTheme();invalidate();refreshLocations();saveNow();render();toast("Restored");}catch(e){toast("Could not restore");}}});
}
function download(name,content,type="text/plain"){
const a=document.createElement("a"),u=URL.createObjectURL(new Blob([content],{type}));
a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(u),800);
}
function csv(rows){
if(!rows.length)return "";
const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
return [keys.map(q).join(","),...rows.map(r=>keys.map(k=>q(r[k])).join(","))].join("\n");
}
function copyText(v,ok){
const fallback=()=>{const ta=document.createElement("textarea");ta.value=v;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(ok);}catch(e){toast("Copy failed");}ta.remove();};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>toast(ok),fallback);else fallback();
}
/* ============================================================
Local SVG chart engine (no external chart library)
============================================================ */
const PALETTE=["#f59e0b","#fbbf24","#34d399","#60a5fa","#f87171","#a78bfa","#fb923c","#a8a29e"];
const CGRID="#2a2620",CAX="#a8a29e",CDIM="#646262";
const n1=v=>Number(v).toFixed(1);
function svgWrap(w,h,inner,label){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;}
function emptyPlot(msg){return svgWrap(640,180,`<text x="320" y="94" fill="${CDIM}" font-size="11" text-anchor="middle" font-family="inherit">${esc(msg)}</text>`,"No data");}
function chartLegend(items,w,y){
let s="",x=12;
items.forEach(it=>{
const name=String(it.name);const wd=name.length*5.4+20;
if(x+wd>w-8){x=12;y+=13;}
s+=`<rect x="${n1(x)}" y="${n1(y-7)}" width="8" height="8" rx="1" fill="${it.color}"/>`;
s+=`<text x="${n1(x+12)}" y="${n1(y)}" fill="${CAX}" font-size="9" font-family="inherit">${esc(name)}</text>`;
x+=wd;
});
return {s,nextY:y+14};
}
function axisFrame(w,h,x0,x1,y0,y1,pad){
const X=v=>pad.l+(v-x0)/((x1-x0)||1)*(w-pad.l-pad.r);
const Y=v=>h-pad.b-(v-y0)/((y1-y0)||1)*(h-pad.t-pad.b);
let s="";
for(let i=0;i<=4;i++){
const yv=y0+(y1-y0)*i/4;
s+=`<line x1="${pad.l}" y1="${n1(Y(yv))}" x2="${w-pad.r}" y2="${n1(Y(yv))}" stroke="${CGRID}"/>`;
s+=`<text x="${pad.l-6}" y="${n1(Y(yv)+3)}" fill="${CAX}" font-size="8.5" text-anchor="end" font-family="inherit">${esc(compact(yv))}</text>`;
}
return {X,Y,s};
}
function lineSVG(data,extra){
const labels=data.labels||[],sets=(data.datasets||[]).filter(d=>d.data);
const nums=sets.flatMap(d=>d.data.filter(v=>v!=null&&Number.isFinite(v)));
if(!labels.length||!nums.length)return emptyPlot("No data loaded yet");
const w=640,h=extra.tall?300:230;
const leg=extra.legend?chartLegend(sets.map((d,i)=>({name:d.label||("series "+(i+1)),color:d.borderColor||PALETTE[i%PALETTE.length]})),w,h-8):null;
const pad={l:52,r:14,t:14,b:leg?46:28};
let y0=Math.min(0,...nums),y1=Math.max(...nums);
if(y1===y0)y1=y0+1;
const f=axisFrame(w,h,0,Math.max(1,labels.length-1),y0,y1,pad);
let s=f.s;
const step=Math.max(1,Math.ceil(labels.length/6));
labels.forEach((lb,i)=>{
if(i%step&&i!==labels.length-1)return;
s+=`<text x="${n1(f.X(i))}" y="${h-pad.b+13}" fill="${CAX}" font-size="8" text-anchor="middle" font-family="inherit">${esc(String(lb).slice(5)||lb)}</text>`;
});
sets.forEach((d,di)=>{
const color=d.borderColor||PALETTE[di%PALETTE.length];
let path="",open=false;
d.data.forEach((v,i)=>{
if(v==null||!Number.isFinite(v)){open=false;return;}

async function readImportFile(file){
if(file.size>LIMITS.fileBytes)throw Error(`File is larger than ${Math.round(LIMITS.fileBytes/1048576)} MB.`);
const ext=file.name.split(".").pop().toLowerCase();
if(ext==="csv"||ext==="txt")return [{label:file.name,rows:parseCsv(await file.text())}];
if(ext==="json"){
let value=JSON.parse(await file.text());
value=Array.isArray(value)?value:(value.rows||value.data||[]);
if(!Array.isArray(value))throw Error("JSON must be an array of row objects.");
return [{label:file.name,rows:value}];
}
toast("Fetching the spreadsheet reader…");
const XLSX=await ensureXLSX();
const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
const jobs=[];
for(const sheetName of wb.SheetNames){
if(IGNORE.has(sheetName))continue;
const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{defval:"",raw:true});
if(rows.length)jobs.push({label:`${file.name} / ${sheetName}`,rows:rows.slice(0,LIMITS.rowsPerSheet)});
}
return jobs;
}

function parseCsv(text){
const clean=String(text).replace(/^\uFEFF/,"");
const first=clean.split(/\r?\n/,1)[0]||"";
const delimiter=[",","\t",";","|"].map(d=>({d,n:first.split(d).length-1})).sort((a,b)=>b.n-a.n)[0].d;
const rows=[];let row=[],cell="",quote=false;
for(let i=0;i<clean.length;i++){
const c=clean[i],n=clean[i+1];
if(c==='"'){if(quote&&n==='"'){cell+='"';i++;}else quote=!quote;}
else if(c===delimiter&&!quote){row.push(cell);cell="";}
else if((c==="\n"||c==="\r")&&!quote){
if(c==="\r"&&n==="\n")i++;
row.push(cell);cell="";
if(row.some(x=>String(x).trim()!==""))rows.push(row);
row=[];
}else cell+=c;
}
row.push(cell);
if(row.some(x=>String(x).trim()!==""))rows.push(row);
if(!rows.length)return [];
const headers=rows[0].map((x,i)=>String(x).trim()||`Column_${i+1}`);
return rows.slice(1).map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]??""])));
}

const p=look?past.slice(-look).reduce((a,b)=>a+b,0)/look:mean;

if(!s.some(x=>x.guest_count)){score-=7;issues.push("Guest counts are missing from sales.");}
}
}
if(!app.db.purchases.length){score-=8;issues.push("Purchases are missing; actual COGS is incomplete.");}
if(!app.db.recipes.length&&!app.db.menu.length){score-=10;issues.push("Recipes/menu costs are missing; theoretical COGS is incomplete.");}
if(!app.db.inventory.length){score-=5;issues.push("Inventory counts are missing.");}
if(!app.db.labor.length){score-=7;issues.push("Labor data is missing.");}
if(!app.db.expenses.length){score-=5;issues.push("Operating expense data is missing.");}
if(!issues.length)issues.push("Core datasets present. Validate mappings and units before making decisions.");
return {score:Math.max(0,score),issues};
});
}

Operations + control analytics
============================================================ */
function itemUnitPlan(){
const next=forecast(1).future[0],history=dailySales();
if(!next||!history.length)return [];
const days=Math.max(1,Math.min(28,rangeDays()));
const recentSales=history.slice(-days).reduce((a,x)=>a+x.sales,0);
const dailyBaseline=recentSales/days||next.sales;
const scale=next.sales/Math.max(1,dailyBaseline);
const map=new Map();
salesRows().forEach(x=>{
const name=String(x.item_name||x.item_id||"Unknown").trim();
const row=map.get(name)||{item:name,units:0};
row.units+=x.quantity;map.set(name,row);
});
return [...map.values()].map(x=>({...x,dailyUnits:x.units/days,plannedUnits:Math.max(0,Math.round(x.units/days*scale))})).sort((a,b)=>b.plannedUnits-a.plannedUnits);
}
function prepPlan(){
const plans=itemUnitPlan();
if(!plans.length||!app.db.recipes.length)return [];
const map=new Map();
plans.forEach(item=>{
app.db.recipes.forEach(recipe=>{
if(String(recipe.menu_item||"").trim().toLowerCase()!==item.item.toLowerCase())return;
const ingredient=String(recipe.ingredient||recipe.ingredient_id||"Unknown").trim();
const key=ingredient.toLowerCase();
const row=map.get(key)||{ingredient,quantity:0,unit:recipe.unit||"",recipeUnits:0};
const yieldPct=num(recipe.yield_pct||100)/100||1;
row.quantity+=num(recipe.quantity)*item.plannedUnits/yieldPct;
row.recipeUnits+=item.plannedUnits;
map.set(key,row);
});
});
return [...map.values()].sort((a,b)=>b.quantity-a.quantity);
}
function orderPlan(){
const lead=num(app.settings.supplierLeadDays)||2,safety=num(app.settings.safetyDays)||1,coverage=num(app.settings.orderCoverageDays)||5;
return inventoryRows().filter(x=>x.usage>0&&x.days<lead+safety+coverage)
.map(x=>{const target=x.usage*(lead+safety+coverage);const orderQty=Math.max(0,target-x.qty);return {...x,orderQty,estimatedCost:orderQty*x.unitCost};})
.filter(x=>x.orderQty>1e-4).sort((a,b)=>b.estimatedCost-a.estimatedCost);
}
function staffingPlan(){
const next=forecast(1).future[0];
const check=avgCheck();
const guests=next&&check?Math.round(next.sales/check):0;
const foh=num(app.settings.staffing?.fohGuestsPerPerson)||28;
const boh=num(app.settings.staffing?.bohGuestsPerPerson)||24;
const manager=num(app.settings.staffing?.managerGuestsPerPerson)||120;
return {guests,peak:guests>=180?"High":guests>=100?"Medium":"Normal",
foh:guests?Math.max(1,Math.ceil(guests/foh)):0,boh:guests?Math.max(1,Math.ceil(guests/boh)):0,managers:guests?Math.max(1,Math.ceil(guests/manager)):0};
}
function closeItems(){return [["sales","POS sales imported"],["payments","Payments reconciled"],["labor","Labor checked"],["waste","Waste entered"],["inventory","Closing inventory checked"],["purchases","Supplier invoices entered"],["discounts","Discounts / voids reviewed"]];}
function closeState(){const key=dateKey(new Date());return {key,values:app.settings.dailyCloses?.[key]||{}};}
function saveDailyClose(){
const state=closeState();
app.settings.dailyCloses=app.settings.dailyCloses||{};
const values={};
closeItems().forEach(([key])=>{values[key]=!!$("close_"+key)?.checked;});
app.settings.dailyCloses[state.key]=values;
saveNow();renderOperations();toast("Daily close saved");
}
function supplierWatchRows(){
const groups=new Map();
purchaseRows().forEach(x=>{const key=String(x.ingredient||"Unknown").trim().toLowerCase();const rows=groups.get(key)||[];rows.push(x);groups.set(key,rows);});
return [...groups.values()].map(rows=>{
rows.sort((a,b)=>a.date.localeCompare(b.date));
const average=list=>list.length?list.reduce((a,x)=>a+x.unit_cost,0)/list.length:0;
const recentAvg=average(rows.slice(-3)),priorAvg=average(rows.slice(-6,-3))||recentAvg;
const change=priorAvg?(recentAvg-priorAvg)/priorAvg*100:null;
const last=rows.at(-1);
return {ingredient:last?.ingredient||"Unknown",vendor:last?.vendor||"Unknown",recentAvg,priorAvg,latestCost:last?.unit_cost||0,change,lastDate:last?.date||""};
}).sort((a,b)=>Math.abs(b.change||0)-Math.abs(a.change||0));
}
function theoreticalCOGSForDates(dates){return salesRows().filter(x=>dates.has(x.date)).reduce((s,x)=>s+recipeCost(x.item_name)*x.quantity,0);}
function weeklyChanges(){
const d=dailySales(),n=Math.min(7,Math.floor(d.length/2));
if(!n)return [];
const current=d.slice(-n),prior=d.slice(-2*n,-n);
const sum=rows=>rows.reduce((a,x)=>a+x.sales,0);
const currentSales=sum(current),priorSales=sum(prior);
const currentGuests=current.reduce((a,x)=>a+x.covers,0),priorGuests=prior.reduce((a,x)=>a+x.covers,0);
const currentCheck=currentGuests?currentSales/currentGuests:0,priorCheck=priorGuests?priorSales/priorGuests:0;
const dc=new Set(current.map(x=>x.date)),dp=new Set(prior.map(x=>x.date));
const cogsCurrent=theoreticalCOGSForDates(dc),cogsPrior=theoreticalCOGSForDates(dp);
const laborCurrent=laborRows().filter(x=>dc.has(x.date)).reduce((a,x)=>a+x.labor_cost,0);
const laborPrior=laborRows().filter(x=>dp.has(x.date)).reduce((a,x)=>a+x.labor_cost,0);
const wasteCurrent=wasteRows().filter(x=>dc.has(x.date)).reduce((a,x)=>a+x.cost,0);
const wastePrior=wasteRows().filter(x=>dp.has(x.date)).reduce((a,x)=>a+x.cost,0);
const delta=(a,b)=>b?(a-b)/Math.abs(b)*100:null;
const points=(a,b)=>a==null||b==null?null:a-b;
const fc=currentSales?cogsCurrent/currentSales*100:0,fp=priorSales?cogsPrior/priorSales*100:0;
const lc=currentSales?laborCurrent/currentSales*100:0,lp=priorSales?laborPrior/priorSales*100:0;
return [["Revenue",currentSales,priorSales,delta(currentSales,priorSales)],["Guests",currentGuests,priorGuests,delta(currentGuests,priorGuests)],["Average check",currentCheck,priorCheck,delta(currentCheck,priorCheck)],["Food cost %",fc,fp,points(fc,fp)],["Labor %",lc,lp,points(lc,lp)],["Waste",wasteCurrent,wastePrior,delta(wasteCurrent,wastePrior)]];
}
function controlScore(){
const c=cogsReconciliation(),q=quality(),r=revenue();
const foodPct=r?c.theoretical/r*100:0,laborPct=r?labor()/r*100:0;
const variancePct=c.theoretical?Math.abs(c.variance)/c.theoretical*100:0;
const supplierAlerts=supplierWatchRows().filter(x=>x.change!=null&&x.change>5).length;
let profitability=100;
if(r<=0)profitability-=35;
if(foodPct>app.settings.foodTarget)profitability-=20;
if(laborPct>app.settings.laborTarget)profitability-=15;
let food=100-Math.min(45,variancePct*3);
if(!app.db.recipes.length)food-=20;
if(!c.complete)food-=15;
return {overall:Math.round(Math.max(0,profitability)*.35+Math.max(0,food)*.25+Math.max(0,100-supplierAlerts*12)*.15+q.score*.25),
profitability:Math.max(0,Math.round(profitability)),food:Math.max(0,Math.round(food)),supplier:Math.max(0,100-supplierAlerts*12),data:q.score};
}

function monthlyPnl(){
return cache("pnl",()=>{
const m=new Map();
const add=(d,k,v)=>{const x=m.get(d)||{month:d,sales:0,cogs:0,labor:0,opex:0};x[k]+=v;m.set(d,x);};
const lines=salesRows();
if(lines.length)lines.forEach(r=>{add(r.date.slice(0,7),"sales",r.net_sales);add(r.date.slice(0,7),"cogs",recipeCost(r.item_name)*r.quantity);});
else orderRows().forEach(r=>add(r.date.slice(0,7),"sales",r.net_sales));
laborRows().forEach(r=>add(r.date.slice(0,7),"labor",r.labor_cost));
expenseRows().forEach(r=>add(r.date.slice(0,7),"opex",r.amount));
return [...m.values()].sort((a,b)=>a.month.localeCompare(b.month)).map(x=>({...x,op:x.sales-x.cogs-x.labor-x.opex}));
});
}

function renderScenarios(){
const fields=[["traffic","Guest traffic change %"],["check","Average check change %"],["food","Food cost change %"],["labor","Labor cost change %"],["opex","Other operating cost change %"],["marketing","Marketing spend change %"],["hours","Operating hours change"],["pricing","Price change %"]];

function runScenario(){
const b=scenarioBase();
if(!b.base){$("scenarioResult").innerHTML='<div class="empty">Load dated sales to scale a monthly scenario.</div>';return null;}
const traffic=sc("traffic")/100,check=sc("check")/100,price=sc("pricing")/100,food=sc("food")/100,labc=sc("labor")/100,opx=sc("opex")/100,marketing=sc("marketing")/100;
const r=b.base*(1+traffic)*(1+check)*(1+price);
const c=(theoreticalCOGS()||b.base*.3)*(1+traffic+check*.15)*(1+food);
const l=(labor()||b.base*.2)*(1+traffic*.6)*(1+labc);
const o=(opex()||b.base*.1)*(1+opx)+Math.max(0,opex()*.15)*marketing;
const op=r-c-l-o;
$("scenarioResult").innerHTML=`<div class="metric-list">
<div class="metric-row"><span>Projected monthly sales</span><strong>${money(r)}</strong></div>
<div class="metric-row"><span>Projected COGS</span><strong>${money(c)}</strong></div>
<div class="metric-row"><span>Projected labor</span><strong>${money(l)}</strong></div>
<div class="metric-row"><span>Projected Opex</span><strong>${money(o)}</strong></div>
<div class="metric-row"><span>Operating profit</span><strong class="${op<0?"trend-bad":"trend-good"}">${money(op)}</strong></div>
<div class="metric-row"><span>Operating margin</span><strong>${percent(r?op/r*100:0)}</strong></div></div>
<div class="footer-note">Baseline is the loaded daily average × 30. Fallback cost ratios (30% / 20% / 10%) are used only where data is missing.</div>`;
return {r,c,l,o,op};
}

function copilot(q){
q=String(q||"").toLowerCase();
const r=revenue(),c=theoreticalCOGS(),l=labor(),op=r-c-l-opex(),fp=r?c/r*100:0,lp=r?l/r*100:0;
if(!hasAnyData())return "No data is loaded. Import a POS export or load the demo dataset first.";
if(/prime cost/.test(q))return `Prime cost is <strong>${money(c+l)}</strong> — ${percent(r?(c+l)/r*100:0)} of loaded sales (theoretical COGS ${money(c)} + labor ${money(l)}). A common planning ceiling is 60–65%; your targets imply ${percent(app.settings.foodTarget+app.settings.laborTarget)}.`;
if(/profit|margin|earning|leaking/.test(q)){
const s=[];
if(fp>app.settings.foodTarget)s.push(`food cost at ${percent(fp)} is above target`);
if(lp>app.settings.laborTarget)s.push(`labor at ${percent(lp)} is above target`);
if(op<0)s.push(`operating profit is negative at ${money(op)}`);
return `Current operating estimate: <strong>${money(op)}</strong>. Revenue ${money(r)}, theoretical COGS ${money(c)}, labor ${money(l)}, Opex ${money(opex())}. Main signals: ${s.join("; ")||"no major cost-ratio breach"}.`;
}
if(/order|buy|stock|ingredient|reorder/.test(q)){
const a=inventoryRows().filter(x=>x.status!=="OK").slice(0,8);
return a.length?`Highest-priority inventory actions:<ul class="list-clean">${a.map(x=>`<li><strong>${esc(x.ingredient)}</strong> — ${x.days>100?"no usable usage history":x.days.toFixed(1)+" days of cover"}; stock ${x.qty} ${esc(x.unit)}; ${esc(x.status)}.</li>`).join("")}</ul>`:"No ingredient is currently flagged for reorder. Add stock counts, recipes and lead times for stronger planning.";
}
if(/raise price|pricing|price/.test(q)){
const a=menuAnalysis();
const puzzles=a.filter(x=>x.class==="Puzzle").slice(0,4),dogs=a.filter(x=>x.class==="Dog").slice(0,4);
return `Pricing candidates:<ul class="list-clean">${puzzles.map(x=>`<li><strong>${esc(x.name)}</strong> — high contribution ${money(x.cmPerUnit)}/unit but low volume; test visibility or a small price move.</li>`).join("")||"<li>No high-margin/low-volume items detected.</li>"}${dogs.map(x=>`<li><strong>${esc(x.name)}</strong> — low volume and low contribution; rework, reprice or remove.</li>`).join("")}</ul>Use the Menu simulator to test elasticity assumptions.`;
}
if(/menu|dish|item|food cost high|strongest/.test(q)&&!/food cost|cogs/.test(q)){
return `Top contribution items:<ul class="list-clean">${menuAnalysis().slice(0,5).map(x=>`<li><strong>${esc(x.name)}</strong> — ${esc(x.class)}; ${x.qty.toLocaleString()} units; contribution ${money(x.cm)}; food cost ${percent(x.foodPct)}.</li>`).join("")||"<li>No item-level sales loaded.</li>"}</ul>`;
}
if(/labor|staff|employee|wage/.test(q)){
const h=laborRows().reduce((a,x)=>a+x.hours,0),st=staffingPlan();
return `Labor is <strong>${percent(lp)}</strong> of loaded sales with <strong>${money(l)}</strong> in cost. Sales / labor hour: <strong>${money(h?r/h:0)}</strong>. Target ${percent(app.settings.laborTarget)}. Tomorrow's suggested mix: ${st.guests?`${st.foh} FOH / ${st.boh} BOH / ${st.managers} manager`:"no forecast yet"}.`;
}
if(/forecast|tomorrow|next week|next month/.test(q)){
const f=forecast(7),n=f.future[0],w=f.future.reduce((a,x)=>a+x.sales,0);
return `Method: <strong>${esc(f.method)}</strong>. Next day <strong>${money(n?.sales||0)}</strong>, range <strong>${money(n?.lo||0)}–${money(n?.hi||0)}</strong>. Next 7 days <strong>${money(w)}</strong>. WAPE: <strong>${f.wape==null?"not available":percent(f.wape)}</strong>.`;
}
if(/break.?even/.test(q)){
const b=breakEven();
return `Break-even sales are approximately <strong>${money(b.breakEvenSales)}</strong>${b.breakEvenGuests?`, or about <strong>${Math.ceil(b.breakEvenGuests).toLocaleString()} guests</strong>`:""}. Contribution margin ratio: <strong>${percent(b.cmr*100)}</strong>.`;
}
if(/food cost|cogs|waste|variance/.test(q)){
const rec=cogsReconciliation(),v=rec.actual-rec.theoretical,w=wasteRows().reduce((s,x)=>s+x.cost,0);
return `Theoretical COGS ${money(rec.theoretical)}; actual COGS ${money(rec.actual)}; variance ${money(v)}; logged waste ${money(w)}. ${rec.complete?"":"Reconciliation is incomplete — purchases, inventory counts and recipes are all required."}`;
}
if(/guest|capacity|serve|seat/.test(q)){
const days=Math.max(1,rangeDays());
return `Loaded covers: <strong>${covers().toLocaleString()}</strong> over ${days} days (${(covers()/days).toFixed(0)}/day). Seat capacity at ${app.settings.seats} seats × ${app.settings.hours} h is a theoretical ceiling; real capacity depends on turn time and party mix. Average check ${money(avgCheck())}.`;
}
return "I can answer about sales, profit, prime cost, forecast, inventory, menu engineering, pricing, labor, food cost, waste, capacity and break-even — using only the data loaded in this browser.";
}

function openCapex(){
openModal("Capital expenditure calculator",`<div class="formgrid">
<div class="field"><label>Purchase cost</label><input id="cxCost" type="number" value="100000" min="0"></div>
<div class="field"><label>Annual net benefit</label><input id="cxBenefit" type="number" value="50000"></div>
<div class="field"><label>Useful life (years)</label><input id="cxLife" type="number" value="5" min="1" max="50"></div>

<div class="toolbar" style="margin-top:9px"><button class="btn primary" id="calcCapex" type="button">Calculate</button></div>
<div id="capexResult" style="margin-top:9px"></div>`);
$("calcCapex").onclick=()=>{
const c=num($("cxCost").value),b=num($("cxBenefit").value),life=Math.max(1,Math.min(50,num($("cxLife").value))),r=num($("cxRate").value)/100;
const pay=b>0?c/b:Infinity;
let npv=-c;
if(r===0)npv=-c+b*life;else for(let y=1;y<=life;y++)npv+=b/(1+r)**y;
$("capexResult").innerHTML=`<div class="successbox">Simple payback: <strong>${Number.isFinite(pay)?pay.toFixed(2)+" years":"—"}</strong><br>NPV at ${percent(r*100)}: <strong>${money(npv)}</strong><br>A precise IRR needs a full cash-flow series.</div>`;
};
}

function loadDemo(){
const names=["Chicken Biryani","Chicken Burger","Beef Burger","French Fries","Grilled Chicken","Cold Coffee","Coke 330ml","Cheesecake"];
const cats=["Main","Main","Main","Side","Main","Beverage","Beverage","Dessert"];
const costs=[130,120,150,40,170,45,18,60],prices=[320,360,420,150,480,180,80,220];
const db=emptyDb(),start=addDays(new Date(),-89);
db.menu=names.map((n,i)=>({item_id:String(i+1),item_name:n,category:cats[i],price:prices[i],ingredient_cost:costs[i],prep_minutes:[18,12,14,7,22,5,1,6][i],active:"1"}));
names.forEach((n,i)=>db.recipes.push({menu_item:n,ingredient:["Rice","Chicken","Beef","Potato","Chicken","Coffee","Cola","Cream"][i],quantity:[.25,.18,.2,.18,.28,.02,1,.06][i],unit:["kg","kg","kg","kg","kg","kg","each","kg"][i],unit_cost:[180,520,750,90,610,1400,65,900][i],yield_pct:95}));
db.locations=[{location_id:"Main",location_name:"Main Branch",city:"Dhaka",active:"1"}];
for(let d=0;d<90;d++){
const dt=addDays(start,d),dow=dt.getDay();
const season=[.82,.94,1,1.05,1.08,1.22,1.18][dow],growth=1+d/180;
const weather=(d%9===0||d%17===0)?.9:1;
const cov=Math.round((180+45*Math.sin(d/7)+20*(dow===5||dow===6))*season*growth*weather);
names.forEach((n,i)=>{
const base=[.27,.18,.12,.17,.1,.07,.06,.03][i];
const q=Math.max(0,Math.round(cov*base*(1+((d*13+i*7)%11-5)/80)));
const gross=q*prices[i],disc=d%13===0?gross*.03:0;
db.sales.push({date:dateKey(dt),time:`${String(11+(i%6)*2).padStart(2,"0")}:00`,order_id:`D${d}-${i}`,item_id:String(i+1),item_name:n,category:cats[i],quantity:q,unit_price:prices[i],gross_sales:gross,discount:disc,refund:0,void:0,net_sales:gross-disc,guest_count:i===0?Math.round(cov*.2):0,order_type:"Dine-in",channel:i%5===0?"Delivery":"Dine-in",payment_method:i%2?"Card":"Cash",location:"Main"});
});
db.guests.push({date:dateKey(dt),served_covers:cov,walk_ins:Math.round(cov*.6),reservation_covers:Math.round(cov*.4),turned_away:d%7===5?12:0,no_shows:d%7===5?2:0,location:"Main"});
db.labor.push({date:dateKey(dt),employee:"Kitchen Team",role:"Kitchen",hours:Math.max(7,8+dow%3),hourly_wage:120,labor_cost:Math.max(7,8+dow%3)*120,location:"Main"},{date:dateKey(dt),employee:"FOH Team",role:"Front of House",hours:Math.max(8,8+dow%2),hourly_wage:110,labor_cost:Math.max(8,8+dow%2)*110,location:"Main"});
if(d%2===0){
db.expenses.push({date:dateKey(dt),category:"Utilities",amount:900,location:"Main"});
db.purchases.push({date:dateKey(dt),vendor:"Local Foods",ingredient:"Chicken",quantity:35,unit:"kg",unit_price:520+(d%7)*4,total:35*(520+(d%7)*4),location:"Main"},{date:dateKey(dt),vendor:"Local Foods",ingredient:"Rice",quantity:45,unit:"kg",unit_price:180,total:8100,location:"Main"});
}
if(d%5===0)db.waste.push({date:dateKey(dt),ingredient:"Vegetables",quantity:2.5,unit:"kg",reason:"Prep loss",cost:450,location:"Main"});
db.inventory.push({date:dateKey(dt),ingredient:"Chicken",quantity:42,closing_quantity:42,unit:"kg",unit_cost:520,expiry_date:dateKey(addDays(dt,3)),location:"Main"},{date:dateKey(dt),ingredient:"Rice",quantity:60,closing_quantity:60,unit:"kg",unit_cost:180,location:"Main"});
}
app.db=db;
app.settings={...DEFAULTS,name:"Aznur Demo Restaurant",fixedMonthly:120000,openingCash:500000,demo:true,theme:app.settings.theme,dateFormat:app.settings.dateFormat};
invalidate();refreshLocations();saveNow();render();toast("Demo dataset loaded");
}

function boot(){
try{
mountViews();
loadState();
applyTheme();
buildNav();
refreshLocations();
bind();
const hash=location.hash.replace(/^#/,"");
app.view=TITLES[hash]?hash:"dashboard";
document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===`view-${app.view}`));
document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===app.view));
$("topTitle").textContent=TITLES[app.view];
if(!hasAnyData())loadDemo();else{invalidate();render();}
}catch(error){
console.error(error);
const host=$("viewHost");
if(host)host.innerHTML=`<div class="card"><div class="dangerbox"><strong>Restaurant Studio could not start.</strong><br><span class="smalltext">${esc(error.message||error)}</span></div></div>`;
}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else boot();
})();
