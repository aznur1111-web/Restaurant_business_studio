<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fafafa">
<meta name="description" content="Aznur Restaurant Business Studio — local-first restaurant analytics.">
<title>Aznur Restaurant Business Studio</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script async src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#fafafa;
  --panel:#fff;
  --panel2:#fafaf9;
  --border:#e7e5e4;
  --border2:#d6d3d1;
  --text:#1c1917;
  --dim:#57534e;
  --dimmer:#78716c;
  --accent:#f59e0b;
  --accent2:#d97706;
  --green:#10b981;
  --yellow:#f59e0b;
  --red:#ef4444;
  --green-soft:#ecfdf5;
  --warn-soft:#fffbeb;
  --red-soft:#fef2f2;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --radius:6px;
  --sidebar:246px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;

}

* {
  box-sizing:border-box;

}

html,body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:13px;

}

body {
  overflow-x:hidden;

}

button,input,select,textarea {
  font:inherit;

}

button {
  cursor:pointer;

}

::-webkit-scrollbar {
  width:8px;
  height:8px;

}

::-webkit-scrollbar-track {
  background:transparent;

}

::-webkit-scrollbar-thumb {
  background:#d6d3d1;
  border-radius:4px;

}

::-webkit-scrollbar-thumb:hover {
  background:#a8a29e;

}

.app {
  display:grid;
  grid-template-columns:var(--sidebar) minmax(0,1fr);
  min-height:100vh;

}

.sidebar {
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  padding:14px 12px;
  background:#fafafa;
  border-right:1px solid var(--border);

}

.brand {
  display:flex;
  gap:10px;
  align-items:center;
  padding:4px 6px 12px;
  margin-bottom:8px;
  border-bottom:1px solid var(--border);

}

.logo {
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border:1px solid #fde68a;
  border-radius:6px;
  background:#fffbeb;
  color:var(--accent2);
  font-weight:800;

}

.brand h1 {
  margin:0;
  font-size:13px;

}

.brand small {
  display:block;
  margin-top:3px;
  color:var(--dimmer);
  font-size:10px;

}

.section-label {
  margin:16px 6px 7px;
  color:var(--dimmer);
  font:9px var(--mono);
  letter-spacing:1.4px;
  text-transform:uppercase;

}

.nav {
  display:grid;
  gap:2px;

}

.nav button {
  width:100%;
  padding:8px 9px;
  border:1px solid transparent;
  border-radius:4px;
  background:transparent;
  color:var(--dim);
  text-align:left;
  font-size:11.5px;

}

.nav button:hover {
  border-color:var(--border);
  background:#fffbeb;
  color:var(--text);

}

.nav button.active {
  border-color:#fde68a;
  background:#fffbeb;
  color:var(--accent2);
  font-weight:650;

}

.sidefoot {
  margin:16px 5px 0;
  padding-top:12px;
  border-top:1px solid var(--border);
  color:var(--dimmer);
  font-size:9.5px;
  line-height:1.5;

}

.content {
  min-width:0;

}

.topbar {
  position:sticky;
  top:0;
  z-index:10;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 18px;
  background:linear-gradient(180deg,#fff,#fafafa);
  border-bottom:1px solid var(--border);

}

.topbar h2 {
  margin:0;
  font-size:14px;
  font-weight:650;

}

.top-actions,.toolbar {
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;

}

.container {
  width:min(1680px,100%);
  margin:auto;
  padding:20px;

}

.view {
  display:none;

}

.view.active {
  display:block;
  animation:fade .18s ease;

}

@keyframes fade {
  from {
    opacity:.1;
    transform:translateY(3px);
  }
  to {
    opacity:1;
    transform:none;
  }

}

.pagehead {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:14px;

}

.pagehead h3 {
  margin:0;
  font:14px var(--mono);
  letter-spacing:1.4px;
  text-transform:uppercase;

}

.pagehead p {
  margin:5px 0 0;
  color:var(--dimmer);
  font-size:11px;

}

.grid {
  display:grid;
  gap:12px;

}

.kpis {
  grid-template-columns:repeat(6,minmax(0,1fr));

}

.two {
  grid-template-columns:1.45fr .95fr;

}

.three {
  grid-template-columns:repeat(3,minmax(0,1fr));

}

.four {
  grid-template-columns:repeat(4,minmax(0,1fr));

}

.card,.stat {
  min-width:0;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--panel);
  box-shadow:var(--shadow);

}

.card {
  padding:14px 15px;

}

.stat {
  position:relative;
  overflow:hidden;
  padding:12px 13px;
  background:var(--panel2);

}

.stat:before {
  position:absolute;
  inset:0 auto 0 0;
  width:2px;
  content:"";
  background:var(--accent);
  opacity:.75;

}

.card h4 {
  margin:0 0 11px;
  color:var(--accent2);
  font:10.5px var(--mono);
  letter-spacing:1.2px;
  text-transform:uppercase;

}

.stat .k {
  color:var(--dimmer);
  font:9px var(--mono);
  letter-spacing:1px;
  text-transform:uppercase;

}

.stat .v {
  margin:5px 0 2px;
  font:700 18px var(--mono);
  font-variant-numeric:tabular-nums;

}

.stat .d {
  color:var(--dimmer);
  font:9px var(--mono);

}

.field label {
  display:block;
  margin-bottom:4px;
  color:var(--dimmer);
  font:9px var(--mono);

}

.field input,.field select,.field textarea,.topbar select {
  width:100%;
  padding:7px 8px;
  border:1px solid var(--border);
  border-radius:4px;
  background:#fff;
  color:var(--text);
  font-size:11px;

}

.field textarea {
  min-height:78px;
  resize:vertical;

}

.field input:focus,.field select:focus,.field textarea:focus,.topbar select:focus {
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(245,158,11,.08);

}

.formgrid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;

}

.span2 {
  grid-column:span 2;

}

.btn {
  min-height:30px;
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:4px;
  background:#fff;
  color:var(--accent2);
  font-size:11px;

}

.btn:hover {
  border-color:var(--accent);
  background:#fffbeb;
  box-shadow:0 0 0 2px rgba(245,158,11,.08);

}

.btn.primary {
  border-color:var(--accent);
  background:var(--accent);
  color:#fff;

}

.btn.primary:hover {
  border-color:var(--accent2);
  background:var(--accent2);

}

.btn.danger {
  border-color:#fecaca;
  background:var(--red-soft);
  color:#b91c1c;

}

.btn.small {
  min-height:28px;
  padding:5px 8px;
  font-size:10px;

}

.pill {
  display:inline-flex;
  align-items:center;
  min-height:25px;
  padding:4px 8px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
  color:var(--dimmer);
  font:9px var(--mono);

}

.tablewrap {
  overflow:auto;
  border:1px solid var(--border);
  border-radius:4px;

}

.table {
  width:100%;
  border-collapse:collapse;
  font:9.5px var(--mono);
  font-variant-numeric:tabular-nums;

}

.table th,.table td {
  padding:7px;
  border-bottom:1px solid var(--border);
  text-align:left;
  white-space:nowrap;

}

.table th {
  position:sticky;
  top:0;
  background:#fafaf9;
  color:var(--dim);
  font-size:8.5px;
  letter-spacing:.7px;
  text-transform:uppercase;

}

.table tbody tr:hover td {
  background:#fffbeb;

}

.table tbody tr:last-child td {
  border-bottom:0;

}

.badge {
  display:inline-flex;
  align-items:center;
  padding:3px 6px;
  border-radius:999px;
  font:700 8.5px var(--mono);
  letter-spacing:.2px;

}

.badge.good {
  background:var(--green-soft);
  color:#047857;

}

.badge.warn {
  background:var(--warn-soft);
  color:#b45309;

}

.badge.bad {
  background:var(--red-soft);
  color:#b91c1c;

}

.badge.info {
  background:#f1f5f9;
  color:#475569;

}

.metric-list,.list-clean {
  display:grid;
  gap:6px;
  padding:0;
  margin:0;
  list-style:none;

}

.metric-row {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  border-bottom:1px solid var(--border);
  font-size:10px;

}

.metric-row:last-child {
  border-bottom:0;

}

.metric-row strong {
  font:10px var(--mono);
  text-align:right;

}

.list-clean li {
  padding:8px 9px;
  border:1px solid var(--border);
  border-radius:4px;
  background:var(--panel2);
  font-size:10px;
  line-height:1.45;

}

.notice,.warning,.dangerbox,.successbox {
  padding:9px 10px;
  border:1px solid var(--border);
  border-left-width:2px;
  border-radius:4px;
  font-size:9.5px;
  line-height:1.5;

}

.notice {
  border-left-color:var(--accent);
  background:#fffbeb;
  color:#78350f;

}

.warning {
  border-left-color:var(--yellow);
  background:#fffbeb;
  color:#92400e;

}

.dangerbox {
  border-left-color:var(--red);
  background:#fef2f2;
  color:#991b1b;

}

.successbox {
  border-left-color:var(--green);
  background:#ecfdf5;
  color:#065f46;

}

.progress {
  height:5px;
  overflow:hidden;
  border-radius:999px;
  background:#e7e5e4;

}

.progress i {
  display:block;
  height:100%;
  background:var(--accent);
  border-radius:inherit;

}

.chartbox {
  height:285px;
  position:relative;

}

.chartbox.sm {
  height:210px;

}

.chartbox.tall {
  height:345px;

}

.drop {
  padding:22px 18px;
  border:1px dashed #fbbf24;
  border-radius:5px;
  background:#fffbeb;
  text-align:center;

}

.drop.drag {
  background:#fef3c7;

}

.drop input {
  display:none;

}

.drop strong {
  display:block;
  font:10px var(--mono);
  letter-spacing:.6px;
  text-transform:uppercase;

}

.drop span {
  display:block;
  margin:5px 0 10px;
  color:var(--dimmer);
  font-size:9px;

}

.taggrid {
  display:flex;
  gap:5px;
  flex-wrap:wrap;

}

.tag {
  padding:5px 7px;
  border:1px solid var(--border);
  border-radius:4px;
  background:var(--panel2);
  color:var(--dim);
  font:8.5px var(--mono);
  cursor:pointer;

}

.tag:hover {
  border-color:#fde68a;
  background:#fffbeb;
  color:var(--accent2);

}

.empty {
  padding:22px 10px;
  color:var(--dimmer);
  text-align:center;
  font-size:10px;

}

.hr {
  height:1px;
  margin:12px 0;
  background:var(--border);

}

.muted {
  color:var(--dimmer);

}

.smalltext {
  font-size:10px;

}

.modal {
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(28,25,23,.22);

}

.modal.show {
  display:flex;

}

.modalbox {
  width:min(1000px,100%);
  max-height:88vh;
  overflow:auto;
  padding:16px;
  border:1px solid var(--border);
  border-radius:6px;
  background:#fff;
  box-shadow:0 18px 50px rgba(0,0,0,.15);

}

.modalhead {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;

}

.modalhead h3 {
  margin:0;
  color:var(--accent2);
  font:11px var(--mono);
  letter-spacing:1px;
  text-transform:uppercase;

}

.close {
  width:28px;
  height:28px;
  border:1px solid var(--border);
  border-radius:4px;
  background:#fff;
  color:var(--dim);

}

.close:hover {
  border-color:var(--accent);

}

.toast {
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:100;
  padding:9px 12px;
  border:1px solid var(--green);
  border-radius:4px;
  background:var(--green-soft);
  color:#047857;
  font:9.5px var(--mono);
  box-shadow:0 5px 14px rgba(0,0,0,.08);
  opacity:0;
  transform:translateY(5px);
  pointer-events:none;
  transition:.18s;

}

.toast.show {
  opacity:1;
  transform:none;

}

.statusbar {
  display:flex;
  align-items:center;
  gap:18px;
  min-height:24px;
  padding:0 18px;
  border-top:1px solid var(--border);
  background:#fff;
  color:var(--dimmer);
  font:8.5px var(--mono);

}

.statusbar b {
  color:var(--accent2);
  font-weight:600;

}


.import-summary {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin-bottom:10px;
}
.import-stat {
  padding:9px;
  border:1px solid var(--border);
  border-radius:4px;
  background:var(--panel2);
}
.import-stat span {
  display:block;
  color:var(--dimmer);
  font:9px var(--mono);
  text-transform:uppercase;
  letter-spacing:.8px;
}
.import-stat strong {
  display:block;
  margin-top:4px;
  font:700 13px var(--mono);
}
.import-map-table select {
  min-width:210px;
}
.check-row {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:10px;
  color:var(--dim);
}
.check-row input {
  accent-color:var(--accent);
}
@media(max-width:820px){
  .import-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .import-map-table select{min-width:140px}
}

@media(max-width:1180px) {
  .kpis {
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .two,.three,.four {
    grid-template-columns:1fr 1fr;
  }
  .formgrid {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}

@media(max-width:860px) {
  .app {
    grid-template-columns:1fr;
  }
  .sidebar {
    position:fixed;
    left:-256px;
    z-index:40;
    width:246px;
    transition:left .18s;
  }
  .sidebar.open {
    left:0;
  }
  .container {
    padding:14px;
  }
  .kpis,.two,.three,.four {
    grid-template-columns:1fr;
  }
  .formgrid {
    grid-template-columns:1fr;
  }
  .span2 {
    grid-column:auto;
  }
  .pagehead {
    align-items:flex-start;
    flex-direction:column;
  }
  .top-actions .btn:not(.primary),.top-actions .pill {
    display:none;
  }

}

@media print {
  .sidebar,.topbar,.statusbar,.btn,.toolbar {
    display:none!important;
  }
  .app {
    display:block;
  }
  .container {
    padding:0;
  }
  .view {
    display:none!important;
  }
  .view.active {
    display:block!important;
  }
  .card,.stat {
    box-shadow:none;
    break-inside:avoid;
  }

}

.trend-good {
  color:#047857!important;

}

.trend-warn {
  color:#b45309!important;

}

.trend-bad {
  color:#b91c1c!important;

}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
<div class="logo">A</div>
<div>
<h1>Aznur Restaurant</h1>
<small>Business Studio</small>
</div>
</div>
    <div class="section-label">Overview</div>
    <nav class="nav" id="mainNav">
</nav>
    <div class="section-label">Planning</div>
    <nav class="nav" id="planNav">
</nav>
    <div class="sidefoot">
      Local-first • No account required • Your data stays in this browser
      unless you add a backend later.
    </div>
  </aside>
  <main class="content">
    <header class="topbar">
      <div class="toolbar">
<button class="btn small" id="menuBtn" aria-label="Toggle navigation">☰</button>
<h2 id="topTitle">Dashboard</h2>
<span class="pill" id="dataBadge">Demo data</span>
</div>
      <div class="top-actions">
<select id="locationFilter" class="btn small" aria-label="Location filter">
<option value="ALL">All locations</option>
</select>
<button class="btn small" id="demoBtn">Load Demo</button>
<button class="btn primary small" id="importBtn">Import Data</button>
</div>
    </header>
    <div class="container" id="viewHost">
</div>
    <div class="statusbar">
<span>LOCAL <b id="statusData">DEMO</b>
</span>
<span>ROWS <b id="statusRows">0</b>
</span>
<span>LOCATIONS <b id="statusLocations">0</b>
</span>
<span>ANALYTICS <b id="statusEngine">READY</b>
</span>
</div>
  </main>
</div>
<div class="modal" id="modal" aria-hidden="true">
<div class="modalbox">
<div class="modalhead">
<h3 id="modalTitle">Aznur</h3>
<button class="close" id="closeModal" aria-label="Close">×</button>
</div>
<div id="modalBody">
</div>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite">
</div>
<script>

"use strict";
/* ============================================================
   DATA + APP STATE
   ============================================================ */
const KEYS = [
    "sales", "sales_orders", "purchases", "inventory", "inventory_moves", "labor",
    "expenses", "guests", "reservations", "waste", "recipes", "menu", "locations",
    "ingredients", "suppliers", "recipe_headers", "payments", "assets", "loans",
    "marketing", "promotions", "customers", "budget", "events_weather", "tables",
    "daily_operations", "id_map"
];
const CORE = {
    sales: ["date", "time", "order_id", "item_id", "item_name", "category", "quantity", "unit_price",
       "gross_sales", "discount", "refund", "void", "net_sales", "tax", "service_charge", "tip",
          "payment_method", "order_type", "channel", "table", "guest_count", "employee", "location"],
    purchases: ["date", "vendor", "invoice_id", "ingredient", "ingredient_id", "category", "quantity", "unit",
       "unit_price", "discount", "tax", "total", "delivery_date", "location"],
    inventory: ["date", "location", "ingredient", "ingredient_id", "storage_area", "opening_quantity",
       "closing_quantity", "quantity", "unit", "unit_cost", "inventory_value", "expiry_date"],
    labor: ["date", "employee", "role", "department", "clock_in", "clock_out", "hours", "regular_hours",
       "overtime_hours", "hourly_wage", "labor_cost", "tips", "location"],
    expenses: ["date", "category", "subcategory", "vendor", "description", "amount", "tax", "payment_method",
       "fixed_or_variable", "location"],
    guests: ["date", "time", "walk_ins", "reservations", "reservation_covers", "served_covers", "turned_away",
       "no_shows", "tables_used", "seats_used", "location"],
    reservations: ["reservation_date", "reservation_time", "booking_id", "customer_id", "party_size", "source",
       "status", "arrival", "no_show", "cancellation", "table", "location"],
    waste: ["date", "ingredient", "quantity", "unit", "reason", "cost", "department", "location"],
    recipes: ["menu_item", "ingredient", "quantity", "unit", "unit_cost", "yield_pct", "prep_minutes"],
    menu: ["item_id", "item_name", "category", "price", "ingredient_cost", "prep_minutes", "active"]
};

/* Canonical schemas for the complete Aznur dataset. The original UI
   already understands these datasets; the universal importer now does too. */
Object.assign(CORE, {
    sales_orders: ["order_id","date","time","location","order_type","channel","table_id","guest_count","gross_sales","discount","refund","void","net_sales","tax","service_charge","tip","employee_id","customer_id"],
    payments: ["date","time","order_id","payment_method","amount","tip","location","reference"],
    locations: ["location_id","location_name","address","city","country","timezone","active"],

function sampleValues(rows, key, limit = 20) {
    return rows.slice(0, limit).map(row => String(row[key] ?? '').trim()).filter(Boolean);
}

function numberRatio(values) {
    if (!values.length) return 0;
    return values.filter(v => {
        const n = Number(String(v).replace(/[^0-9.\-]/g, ''));
        return v !== '' && Number.isFinite(n);
    }).length / values.length;
}

function dateRatio(values) {
    if (!values.length) return 0;
    return values.filter(v => !!parseDate(v)).length / values.length;
}

function textRatio(values) {
    if (!values.length) return 0;
    return values.filter(v => /[A-Za-z]/.test(v)).length / values.length;
}

function likelyNumericMoney(values) {
    if (!values.length) return 0;
    const numeric = numberRatio(values);
    const moneyLike = values.filter(v => /[$€£¥৳₹]|\d+[,.]\d{2}$/.test(v)).length / values.length;
    return numeric * .55 + moneyLike * .45;
}

function semanticScore(source, target, rows) {
    const n = norm(source).replace(/_/g, '');
    let score = 0;
    if (n === norm(target)) score = 100;
    if ((ALIAS[target] || []).some(a => n === norm(a))) score = Math.max(score, 94);
    const hints = COLUMN_HINTS[target] || [];
    if (hints.some(re => re.test(n))) score = Math.max(score, 78);

    const values = sampleValues(rows, source);
    const nr = numberRatio(values);
    const dr = dateRatio(values);
    const tr = textRatio(values);
    if (target === 'date' || target === 'reservation_date') score += dr * 18;
    if (['quantity','guest_count','served_covers','walk_ins','party_size','hours','prep_minutes','yield_pct'].includes(target)) score += nr * 13;
    if (['gross_sales','net_sales','unit_price','total','unit_cost','ingredient_cost','amount','cost','labor_cost','hourly_wage','tip','tax','discount','refund','void'].includes(target)) score += likelyNumericMoney(values) * 13;
    if (['item_name','ingredient','vendor','employee','role','category','payment_method','channel','order_type','status','reason'].includes(target)) score += tr * 9;
    return Math.min(100, score);
}

function schemaScores(rows, type) {
    const keys = Object.keys(rows[0] || {});
    const signal = IMPORT_SIGNAL[type] || { strong: [], required: [] };
    const total = signal.strong.reduce((sum, target) => {
        const best = Math.max(0, ...keys.map(source => semanticScore(source, target, rows)));
        return sum + best;
    }, 0);
    const requiredHits = signal.required.filter(target =>
        keys.some(source => semanticScore(source, target, rows) >= 65)
    ).length;
    return total + requiredHits * 55;
}

function inferTypeSmart(name, rows) {
    const n = norm(name);
    const candidates = KEYS.filter(k => IMPORT_SIGNAL[k]);
    const scored = candidates.map(type => ({
        type,
        score: schemaScores(rows, type) + (/pos|toast|square|clover|lightspeed|restaurant|sale|order/.test(n) && type.startsWith('sales') ? 35 : 0)
    })).sort((a, b) => b.score - a.score);

    const best = scored[0] || { type: 'sales', score: 0 };
    const second = scored[1]?.score || 0;
    let confidence = Math.round(Math.max(40, Math.min(99, 55 + (best.score - second) * 0.3)));

    const keys = Object.keys(rows[0] || {}).map(norm);
    const hasItem = keys.some(k => /item|product|plu|dish|menu/.test(k));
    const hasQty = keys.some(k => /qty|quantity|unitsold|soldqty/.test(k));
    const hasOrder = keys.some(k => /order|check|ticket|receipt/.test(k));
    const hasMoney = keys.some(k => /total|amount|revenue|sales|gross|net|price/.test(k));
    if (hasItem && hasQty && hasMoney) best.type = 'sales';
    else if (hasOrder && hasMoney && !hasItem && !hasQty) best.type = 'sales_orders';

    return { type: best.type, confidence, ranked: scored.slice(0, 5) };
}

function bestMapping(rows, type) {
    const targets = CORE[type] || [];
    const keys = Object.keys(rows[0] || {});
    const saved = (app.settings.importProfiles || [])
        .filter(p => p.type === type)
        .map(p => p.mapping || {});
    const mapping = {};
    const used = new Set();

    for (const target of targets) {
        let best = null;
        for (const source of keys) {
            if (used.has(source)) continue;
            const direct = semanticScore(source, target, rows);
            let score = direct;
            for (const savedMap of saved) {
                if (savedMap[source] === target) score = Math.max(score, 110);
            }
            if (!best || score > best.score) best = { source, score };
        }
        if (best && best.score >= 60) {
            mapping[target] = best.source;
            used.add(best.source);
        }
    }
    return mapping;
}

function deriveImportRows(rows, type, mapping) {

                out[target] = row[mapping[target]];

        if (type === 'sales') {
            if (!out.net_sales && out.gross_sales !== undefined) {

            if (!out.quantity && out.unit_price && out.net_sales) {
                const price = num(out.unit_price);

            }
            if (!out.gross_sales && out.quantity && out.unit_price) {
                out.gross_sales = num(out.quantity) * num(out.unit_price);
            }
        }
        if (type === 'purchases' && !out.total && out.quantity && (out.unit_cost || out.unit_price)) {
            out.total = num(out.quantity) * num(out.unit_cost || out.unit_price);

    const fields = keyFields[type] || Object.keys(row).slice(0, 8);
    return fields.map(k => norm(row[k] ?? '')).join('|');

function duplicateStats(rows, type) {
    const existing = new Set((app.db[type] || []).map(row => importFingerprint(row, type)));
    const seen = new Set();
    let existingCount = 0;
    let internalCount = 0;
    rows.forEach(row => {
        const fp = importFingerprint(row, type);
        if (existing.has(fp)) existingCount++;
        else if (seen.has(fp)) internalCount++;
        seen.add(fp);
    });
    return { existingCount, internalCount, uniqueCount: Math.max(0, rows.length - existingCount - internalCount) };
}

function importValidation(rows, type, mapping) {
    const rules = {
        sales: [['date', 'Date'], ['quantity', 'Quantity'], ['net_sales', 'Sales value']],
        sales_orders: [['date', 'Date'], ['order_id', 'Order ID'], ['net_sales', 'Order value']],
        purchases: [['date', 'Date'], ['ingredient', 'Ingredient'], ['total', 'Purchase total']],
        inventory: [['date', 'Date'], ['ingredient', 'Ingredient'], ['quantity', 'Stock quantity']],
        labor: [['date', 'Date'], ['hours', 'Hours'], ['labor_cost', 'Labor cost']],
        expenses: [['date', 'Date'], ['amount', 'Expense amount']],
        guests: [['date', 'Date'], ['served_covers', 'Served covers']],
        reservations: [['reservation_date', 'Reservation date'], ['party_size', 'Party size']],
        waste: [['date', 'Date'], ['ingredient', 'Ingredient'], ['cost', 'Waste cost']],
        recipes: [['menu_item', 'Menu item'], ['ingredient', 'Ingredient'], ['quantity', 'Quantity'], ['unit_cost', 'Unit cost']],
        menu: [['item_name', 'Menu item'], ['price', 'Price']]
    };
    const issues = [];
    const warnings = [];
    const ruleSet = rules[type] || [];
    for (const [field, label] of ruleSet) {
        const values = rows.map(r => r[field]).filter(v => v !== '' && v != null);
        if (!values.length) issues.push(`${label} could not be mapped or derived.`);
    }
    const dates = rows.length ? rows.filter(r => parseDate(r.date || r.reservation_date)).length / rows.length : 0;
    if (type === 'sales' && dates < .85) warnings.push(`Only ${Math.round(dates * 100)}% of rows have recognizable dates.`);
    if (type === 'sales' && !mapping.gross_sales && !mapping.net_sales) warnings.push('No sales amount column is mapped; revenue cannot be calculated.');
    if (type === 'purchases' && !mapping.total && !(mapping.quantity && (mapping.unit_cost || mapping.unit_price))) warnings.push('Purchase total is not mapped and cannot be derived safely.');
    if (type === 'labor' && !mapping.labor_cost && !(mapping.hours && mapping.hourly_wage)) warnings.push('Labor cost is not mapped and cannot be derived safely.');
    return { issues, warnings, ok: issues.length === 0 };
}

function finishImportJob(accepted) {
    const job = IMPORT_STATE.current;
    if (!job) return;
    if (accepted) {
        const mapped = deriveImportRows(job.rows, job.type, job.mapping).filter(row => Object.values(row).some(v => String(v ?? '').trim() !== ''));
        const stats = duplicateStats(mapped, job.type);
        const importAll = !!$('importAllDuplicates')?.checked;
        const existing = new Set((app.db[job.type] || []).map(row => importFingerprint(row, job.type)));
        const seen = new Set();
        const finalRows = importAll ? mapped : mapped.filter(row => {
            const fp = importFingerprint(row, job.type);
            if (existing.has(fp) || seen.has(fp)) return false;
            seen.add(fp);
            return true;
        });

        app.db[job.type].push(...finalRows);
        app.settings.demo = false;
        invalidate();
        refreshLocations();
        saveState();

        const profileName = $('importProfileName')?.value.trim();
        if (profileName) saveProfileFromJob(job, profileName);

        const q = $('importQueue');
        if (q) {
            const d = document.createElement('div');
            d.className = 'successbox';
            d.innerHTML = `<strong>${esc(job.label)}</strong> → ${esc(job.type)} · ${finalRows.length.toLocaleString()} rows imported${stats.existingCount ? ` · ${stats.existingCount} duplicates skipped` : ''}`;
            q.appendChild(d);
        }

        const q = $('importQueue');
        if (q) {
            const d = document.createElement('div');
            d.className = 'warning';
            d.textContent = `${job.label}: skipped.`;
            q.appendChild(d);
        }
    }

    IMPORT_STATE.current = null;
    closeModal();
    processNextImport();
}

async function readImportFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv' || ext === 'txt') {
        const text = await file.text();
        const rows = parseCsv(text);
        return [{ label: file.name, rows }];
    }
    if (ext === 'json') {
        let value = JSON.parse(await file.text());
        value = Array.isArray(value) ? value : (value.rows || value.data || []);
        return [{ label: file.name, rows: value }];
    }
    if (!window.XLSX) throw new Error('XLSX library did not load. CSV and JSON imports still work without it.');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const jobs = [];
    for (const sheetName of wb.SheetNames) {
        if (IGNORE.has(sheetName)) continue;
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
        if (rows.length) jobs.push({ label: `${file.name} / ${sheetName}`, rows });
    }
    return jobs;
}

function makeImportJobs(label, rows) {
    if (!rows.length) return [];
    const detected = inferTypeSmart(label, rows);
    return [{
        label,
        rows,
        keys: Object.keys(rows[0] || {}),
        type: detected.type,
        confidence: detected.confidence,
        mapping: bestMapping(rows, detected.type)
    }];
}

async function handleFiles(files) {
    const q = $('importQueue');
    if (q) q.innerHTML = '';
    IMPORT_STATE.queue = [];
    for (const file of [...files]) {
        try {
            const sheets = await readImportFile(file);
            sheets.forEach(sheet => IMPORT_STATE.queue.push(...makeImportJobs(sheet.label, sheet.rows)));
            if (!sheets.length && q) {
                const d = document.createElement('div');
                d.className = 'warning';
                d.textContent = `${file.name}: no rows found.`;
                q.appendChild(d);
            }
        } catch (error) {
            if (q) {
                const d = document.createElement('div');
                d.className = 'dangerbox';
                d.textContent = `${file.name}: ${error.message}`;
                q.appendChild(d);
            }
        }
    }
    processNextImport();
}

function parseCsv(text) {
    const clean = text.replace(/^\uFEFF/, '');
    const first = clean.split(/\r?\n/, 1)[0] || '';
    const delimiters = [',', '\t', ';', '|'];
    const delimiter = delimiters.sort((a, b) => {
        const aa = (first.match(new RegExp(`\\${a === '\\t' ? 't' : a}`, 'g')) || []).length;
        const bb = (first.match(new RegExp(`\\${b === '\\t' ? 't' : b}`, 'g')) || []).length;
        return bb - aa;
    })[0];
    const rows = [];
    let row = [], cell = '', quote = false;
    for (let i = 0; i < clean.length; i++) {
        const c = clean[i], n = clean[i + 1];
        if (c === '"') {
            if (quote && n === '"') {
                cell += '"';
                i++;
            } else quote = !quote;
        } else if (c === delimiter && !quote) {
            row.push(cell);
            cell = '';
        } else if ((c === '\n' || c === '\r') && !quote) {
            if (c === '\r' && n === '\n') i++;
            row.push(cell);
            cell = '';
            if (row.some(x => String(x).trim() !== '')) rows.push(row);
            row = [];
        } else {
            cell += c;
        }
    }
    row.push(cell);
    if (row.some(x => String(x).trim() !== '')) rows.push(row);
    if (!rows.length) return [];
    const headers = rows[0].map((x, i) => String(x).trim() || `Column_${i + 1}`);
    return rows.slice(1).map(values => Object.fromEntries(
        headers.map((header, i) => [header, values[i] ?? ''])
    ));
}

/* ============================================================
   OPERATIONS + CONTROL
   ============================================================ */
function itemUnitPlan() {
    const next = forecast(1).future[0];
    const history = dailySales();
    if (!next || !history.length) return [];

    const days = Math.max(1, Math.min(28, rangeDays()));
    const recentSales = history.slice(-days)
        .reduce((a, x) => a + x.sales, 0);
    const dailyBaseline = recentSales / days || next.sales;
    const scale = next.sales / Math.max(1, dailyBaseline);
    const map = new Map();

    salesRows().forEach(x => {
        const name = String(x.item_name || x.item_id || "Unknown").trim();
        const row = map.get(name) || { item: name, units: 0 };
        row.units += x.quantity;
        map.set(name, row);
    });

    return [...map.values()]
        .map(x => ({
            ...x,
            dailyUnits: x.units / days,
            plannedUnits: Math.max(
                0,
                Math.round(x.units / days * scale)
            )
        }))
        .sort((a, b) => b.plannedUnits - a.plannedUnits);
}

function prepPlan() {
    const plans = itemUnitPlan();
    if (!plans.length || !app.db.recipes.length) return [];

    const map = new Map();
    plans.forEach(item => {
        app.db.recipes.forEach(recipe => {
            if (String(recipe.menu_item || "").trim().toLowerCase() !==
                item.item.toLowerCase()) {
                return;
            }
            const ingredient = String(
                recipe.ingredient || recipe.ingredient_id || "Unknown"
            ).trim();
            const key = ingredient.toLowerCase();
            const row = map.get(key) || {
                ingredient,
                quantity: 0,
                unit: recipe.unit || "",
                recipeUnits: 0
            };
            const yieldPct = num(recipe.yield_pct || 100) / 100 || 1;
            row.quantity += num(recipe.quantity) * item.plannedUnits / yieldPct;
            row.recipeUnits += item.plannedUnits;
            map.set(key, row);
        });
    });

    return [...map.values()].sort((a, b) => b.quantity - a.quantity);
}

function orderPlan() {
    const lead = num(app.settings.supplierLeadDays) || 2;
    const safety = num(app.settings.safetyDays) || 1;
    const coverage = num(app.settings.orderCoverageDays) || 5;
    return inventoryRows()
        .filter(x => x.usage > 0 && x.days < lead + safety + coverage)
        .map(x => {
            const target = x.usage * (lead + safety + coverage);
            const orderQty = Math.max(0, target - x.qty);
            return {
                ...x,
                orderQty,
                estimatedCost: orderQty * x.unitCost
            };
        })
        .filter(x => x.orderQty > 0.0001)
        .sort((a, b) => b.estimatedCost - a.estimatedCost);
}

function staffingPlan() {
    const next = forecast(1).future[0];
    const guests = next
        ? Math.round(next.sales / Math.max(1, avgCheck()))
        : 0;
    const foh = num(app.settings.staffing?.fohGuestsPerPerson) || 28;
    const boh = num(app.settings.staffing?.bohGuestsPerPerson) || 24;
    const manager = num(app.settings.staffing?.managerGuestsPerPerson) || 120;
    const peak = guests >= 180 ? "High" : guests >= 100 ? "Medium" : "Normal";
    return {
        guests,
        peak,
        foh: guests ? Math.max(1, Math.ceil(guests / foh)) : 0,
        boh: guests ? Math.max(1, Math.ceil(guests / boh)) : 0,
        managers: guests ? Math.max(1, Math.ceil(guests / manager)) : 0
    };
}

function supplierWatchRows() {
    const groups = new Map();
    purchaseRows().forEach(x => {
        const key = String(x.ingredient || "Unknown").trim().toLowerCase();
        const rows = groups.get(key) || [];
        rows.push(x);
        groups.set(key, rows);
    });

    return [...groups.values()].map(rows => {
        rows.sort((a, b) => a.date.localeCompare(b.date));
        const recentRows = rows.slice(-3);
        const priorRows = rows.slice(-6, -3);
        const average = list => list.length
            ? list.reduce((a, x) => a + x.unit_cost, 0) / list.length
            : 0;
        const recentAvg = average(recentRows);
        const priorAvg = average(priorRows) || recentAvg;
        const change = priorAvg
            ? (recentAvg - priorAvg) / priorAvg * 100
            : null;
        const last = rows.at(-1);
        return {
            ingredient: last?.ingredient || "Unknown",
            vendor: last?.vendor || "Unknown",
            recentAvg,
            priorAvg,
            latestCost: last?.unit_cost || 0,
            change,
            lastDate: last?.date || ""
        };
    }).sort((a, b) => Math.abs(b.change || 0) - Math.abs(a.change || 0));
}

function weeklyChanges() {
    const d = dailySales();
    const n = Math.min(7, Math.floor(d.length / 2));
    if (!n) return [];
    const current = d.slice(-n);
    const prior = d.slice(-2 * n, -n);
    const sum = rows => rows.reduce((a, x) => a + x.sales, 0);
    const currentSales = sum(current);
    const priorSales = sum(prior);
    const currentGuests = current.reduce((a, x) => a + x.covers, 0);
    const priorGuests = prior.reduce((a, x) => a + x.covers, 0);
    const currentCheck = currentGuests ? currentSales / currentGuests : 0;
    const priorCheck = priorGuests ? priorSales / priorGuests : 0;
    const datesCurrent = new Set(current.map(x => x.date));
    const datesPrior = new Set(prior.map(x => x.date));
    const cogsCurrent = theoreticalCOGSForDates(datesCurrent);
    const cogsPrior = theoreticalCOGSForDates(datesPrior);
    const laborCurrent = laborRows()
        .filter(x => datesCurrent.has(x.date))
        .reduce((a, x) => a + x.labor_cost, 0);
    const laborPrior = laborRows()
        .filter(x => datesPrior.has(x.date))
        .reduce((a, x) => a + x.labor_cost, 0);
    const wasteCurrent = wasteRows()
        .filter(x => datesCurrent.has(x.date))
        .reduce((a, x) => a + x.cost, 0);
    const wastePrior = wasteRows()
        .filter(x => datesPrior.has(x.date))
        .reduce((a, x) => a + x.cost, 0);
    const delta = (a, b) => b ? (a - b) / Math.abs(b) * 100 : null;
    const points = (a, b) => a == null || b == null ? null : a - b;

    return [
        ["Revenue", currentSales, priorSales, delta(currentSales, priorSales)],
        ["Guests", currentGuests, priorGuests, delta(currentGuests, priorGuests)],
        ["Average check", currentCheck, priorCheck, delta(currentCheck, priorCheck)],
        ["Food cost %", currentSales ? cogsCurrent / currentSales * 100 : 0,
            priorSales ? cogsPrior / priorSales * 100 : 0,
            points(
                currentSales ? cogsCurrent / currentSales * 100 : 0,
                priorSales ? cogsPrior / priorSales * 100 : 0
            )],
        ["Labor %", currentSales ? laborCurrent / currentSales * 100 : 0,
            priorSales ? laborPrior / priorSales * 100 : 0,
            points(
                currentSales ? laborCurrent / currentSales * 100 : 0,
                priorSales ? laborPrior / priorSales * 100 : 0
            )],
        ["Waste", wasteCurrent, wastePrior, delta(wasteCurrent, wastePrior)]
    ];
}

function theoreticalCOGSForDates(dates) {
    return salesRows()
        .filter(x => dates.has(x.date))
        .reduce((sum, x) => sum + recipeCost(x.item_name) * x.quantity, 0);
}

function controlScore() {
    const c = cogsReconciliation();
    const q = quality();
    const r = revenue();
    const foodPct = r ? c.theoretical / r * 100 : 0;
    const laborPct = r ? labor() / r * 100 : 0;
    const variancePct = c.theoretical
        ? Math.abs(c.variance) / c.theoretical * 100
        : 0;
    const supplierAlerts = supplierWatchRows()
        .filter(x => x.change != null && x.change > 5).length;

    let profitability = 100;
    if (r <= 0) profitability -= 35;
    if (foodPct > app.settings.foodTarget) profitability -= 20;
    if (laborPct > app.settings.laborTarget) profitability -= 15;

    let food = 100 - Math.min(45, variancePct * 3);
    if (!app.db.recipes.length) food -= 20;

    return {
        overall: Math.round(
            Math.max(0, profitability) * .35 +
            Math.max(0, food) * .25 +
            Math.max(0, 100 - supplierAlerts * 12) * .15 +
            q.score * .25
        ),
        profitability: Math.max(0, Math.round(profitability)),
        food: Math.max(0, Math.round(food)),
        supplier: Math.max(0, 100 - supplierAlerts * 12),
        data: q.score
    };
}

        s.push(`labor at ${percent(lp)} is above target`);
    if (op < 0)
        s.push(`operating profit is negative at ${money(op)}`);
    return `Current operating estimate: <strong>${money(op)}</strong>. Revenue ${money(r)},
       theoretical COGS ${money(c)},
          labor ${money(l)}. Main signals: ${s.join("; ") || "no major cost-ratio breach"}.`;
} if (/order|buy|stock|ingredient/.test(q)) {
    const a = inventoryRows().filter(x => x.status !== "OK").slice(0, 8);
    return a.length ? `Highest-priority inventory actions:<ul class="list-clean">${a.map(x => `<li>

} if (/menu|dish|item|food/.test(q)) {
    return `Top contribution items:<ul class="list-clean">${menuAnalysis().slice(0, 5).map(x => `<li>

} if (/labor|staff|employee|wage/.test(q)) {

function loadDemo() { const names = ["Chicken Biryani", "Chicken Burger", "Beef Burger", "French Fries", "Grilled Chicken", "Cold Coffee", "Coke 330ml", "Cheesecake"], cats = ["Main", "Main", "Main", "Side", "Main", "Beverage", "Beverage", "Dessert"], costs = [130, 120, 150, 40, 170, 45, 18, 60], prices = [320, 360, 420, 150, 480, 180, 80, 220], db = emptyDb(), start = addDays(new Date(), -89); db.menu = names.map((n, i) => ({ item_id: String(i + 1), item_name: n, category: cats[i], price: prices[i], ingredient_cost: costs[i], prep_minutes: [18, 12, 14, 7, 22, 5, 1, 6][i], active: "1" })); names.forEach((n, i) => db.recipes.push({ menu_item: n, ingredient: ["Rice", "Chicken", "Beef", "Potato", "Chicken", "Coffee", "Cola", "Cream"][i], quantity: [.25, .18, .2, .18, .28, .02, 1, .06][i], unit: ["kg", "kg", "kg", "kg", "kg", "kg", "each", "kg"][i], unit_cost: [180, 520, 750, 90, 610, 1400, 65, 900][i], yield_pct: 95 })); for (let d = 0; d < 90; d++) {
    const dt = addDays(start, d), dow = dt.getDay(), season = [.82, .94, 1, 1.05, 1.08, 1.22, 1.18][dow], growth = 1 + d / 180, weather = d % 9 === 0 || d % 17 === 0 ? .9 : 1, cov = Math.round((180 + 45 * Math.sin(d / 7) + 20 * (dow === 5 || dow === 6)) * season * growth * weather);
    names.forEach((n, i) => { const base = [.27, .18, .12, .17, .1, .07, .06, .03][i], q = Math.max(0, Math.round(cov * base * (1 + ((d * 13 + i * 7) % 11 - 5) / 80))), gross = q * prices[i], disc = d % 13 === 0 ? gross * .03 : 0; db.sales.push({ date: dateKey(dt), time: `${11 + (i % 6) * 2}:00`, order_id: `D${d}-${i}-${Math.floor(d * 99 + i)}`, item_id: String(i + 1), item_name: n, category: cats[i], quantity: q, unit_price: prices[i], gross_sales: gross, discount: disc, refund: 0, void: 0, net_sales: gross - disc, guest_count: i === 0 ? Math.round(cov * .2) : 0, order_type: "Dine-in", channel: i % 5 === 0 ? "Delivery" : "Dine-in", payment_method: i % 2 ? "Card" : "Cash", location: "Main" }); });
    db.labor.push({ date: dateKey(dt), employee: "Kitchen Team", role: "Kitchen", hours: Math.max(7, 8 + dow % 3), hourly_wage: 120, labor_cost: Math.max(7, 8 + dow % 3) * 120, location: "Main" }, { date: dateKey(dt), employee: "FOH Team", role: "Front of House", hours: Math.max(8, 8 + dow % 2), hourly_wage: 110, labor_cost: Math.max(8, 8 + dow % 2) * 110, location: "Main" });
    if (d % 2 === 0) {
        db.expenses.push({ date: dateKey(dt), category: "Utilities", amount: 900, location: "Main" });
        db.purchases.push({ date: dateKey(dt), vendor: "Local Foods", ingredient: "Chicken", quantity: 35, unit: "kg", unit_price: 520, total: 18200, location: "Main" }, { date: dateKey(dt), vendor: "Local Foods", ingredient: "Rice", quantity: 45, unit: "kg", unit_price: 180, total: 8100, location: "Main" });
    }
    if (d % 5 === 0)
        db.waste.push({ date: dateKey(dt), ingredient: "Vegetables", quantity: 2.5, unit: "kg", reason: "Prep loss", cost: 450, location: "Main" });
    db.inventory.push({ date: dateKey(dt), ingredient: "Chicken", quantity: 42, closing_quantity: 42, unit: "kg", unit_cost: 520, expiry_date: dateKey(addDays(dt, 3)), location: "Main" });
} app.db = db; app.settings = { ...DEFAULTS, name: "Aznur Demo Restaurant", fixedMonthly: 120000, openingCash: 500000, demo: true }; invalidate(); refreshLocations(); saveState(); render(); toast("Demo dataset loaded"); }
/* ============================================================

   ============================================================ */
function refreshLocations() { const s = $("locationFilter"), old = s.value, set = new Set(); KEYS.forEach(k => app.db[k].forEach(r => { const v = loc(r); if (v)
    set.add(v); })); s.innerHTML = `<option value="ALL">All locations</option>${[...set].sort().map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("")}`; if ([...s.options].some(x => x.value === old))
    s.value = old; }
function updateStatus() { let rows = 0; const ls = new Set(); KEYS.forEach(k => { rows += app.db[k].length;
   app.db[k].forEach(r => { const l = loc(r); if (l)
    ls.add(l); }); }); $("dataBadge").textContent = app.settings.demo ? "Demo data" : app.db.sales.length ? "Live local data" : "No data"; $("periodLabel") && ($("periodLabel").textContent = rangeDays() ? `${rangeDays()} days loaded` : "No sales data"); $("statusData").textContent = app.settings.demo ? "DEMO" : app.db.sales.length ? "LOCAL" : "EMPTY"; $("statusRows").textContent = rows.toLocaleString(); $("statusLocations").textContent = String(ls.size); $("statusEngine").textContent = "READY"; }
function setView(v) { app.view = v; document.querySelectorAll(".view").forEach(x => x.classList.toggle("active", x.id === `view-${v}`)); document.querySelectorAll("[data-view]").forEach(x => x.classList.toggle("active", x.dataset.view === v)); $("topTitle").textContent = TITLES[v] || "Dashboard"; $("sidebar").classList.remove("open"); render(); }
function render() {
    const renderers = {
        dashboard: renderDashboard,
        operations: renderOperations,
        forecast: renderForecast,
        finance: renderFinance,
        menu: renderMenu,
        inventory: renderInventory,
        purchasing: renderPurchasing,
        labor: renderLabor,
        customers: renderCustomers,
        waste: renderWaste,
        control: renderControl,
        scenarios: renderScenarios,
        reports: renderReports,
        copilot: () => {},
        data: renderData,

    };

function bind() {

    $("importBtn").onclick = () => setView("data");

    ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("drag"); }));
    drop.addEventListener("drop", e => handleFiles(e.dataTransfer.files));

        return; app.db = emptyDb(); app.settings = { ...DEFAULTS }; localStorage.removeItem("aznurRestaurantDB"); localStorage.removeItem("aznurRestaurantSettings"); invalidate(); refreshLocations(); render(); toast("Local data cleared"); };

    $("exportInventory").onclick = () => download("aznur_inventory.csv", csv(app.db.inventory), "text/csv");
    $("exportMenu").onclick = () => download("aznur_menu_analysis.csv", csv(menuAnalysis()), "text/csv");

    document.querySelectorAll(".tpl").forEach(b => b.onclick = () => download(`aznur_template_${b.dataset.type}.csv`, `${(CORE[b.dataset.type] || []).join(",")}\n`, "text/csv"));

function boot() {
  try {
    mountViews();
    buildNav();
    loadState();
    if (!app.db.sales.length) {
      loadDemo();
    } else {
      refreshLocations();
